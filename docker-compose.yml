version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: field-sales-db
    environment:
      POSTGRES_USER: fieldsales
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: fieldsales_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsales"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
